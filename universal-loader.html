<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121717">
  <title>Universal Loader</title>
  <style>
    :root { color-scheme: dark; font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; background: #121717; color: #eef2e9; }
    * { box-sizing: border-box; }
    body { display: grid; min-width: 320px; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background-image: radial-gradient(#35413d 0.65px, transparent 0.65px); background-size: 22px 22px; }
    main { width: min(460px, 100%); border: 1px solid #35413d; border-radius: 9px; padding: 28px; background: #202927; box-shadow: 0 24px 70px rgb(0 0 0 / 28%); }
    .eyebrow { margin: 0 0 12px; color: #c9f269; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 30px; font-weight: 500; }
    #status { min-height: 1.5em; margin: 12px 0 18px; color: #9daaa1; font-size: 13px; line-height: 1.5; }
    progress { width: 100%; height: 5px; accent-color: #c9f269; }
    a { color: #c9f269; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Universal Loader</p>
    <h1>Loading the latest app</h1>
    <p id="status" role="status" aria-live="polite">Fetching the current version from GitHub...</p>
    <progress id="progress" aria-label="Loading app"></progress>
  </main>
  <script>
    (async () => {
      const repositoryRoot = "https://raw.githubusercontent.com/thickthighsguy/gamehub/main/App/games/";
      const cacheToken = Date.now();
      const localScripts = ["firebase-config.js", "archive.js", "game-library.js", "firebase-auth.js", "app.js"];
      const status = document.querySelector("#status");
      const progress = document.querySelector("#progress");

      async function fetchText(file) {
        const response = await fetch(`${repositoryRoot}${file}?refresh=${cacheToken}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`${file} returned HTTP ${response.status}`);
        return response.text();
      }

      try {
        const [appHtml, css, ...scripts] = await Promise.all([
          fetchText("index.html"),
          fetchText("styles.css"),
          ...localScripts.map(fetchText)
        ]);
        let documentHtml = appHtml.replace(
          /<link\s+rel="stylesheet"\s+href="\.\/styles\.css"\s*>/i,
          `<style>\n${css}\n</style>`
        );

        localScripts.forEach((file, index) => {
          const scriptTag = new RegExp(`<script src="\\.\\/${file.replaceAll(".", "\\.")}"><\\/script>`, "i");
          const scriptSource = scripts[index];
          if (/<\/script/i.test(scriptSource)) throw new Error(`${file} cannot be safely embedded`);
          documentHtml = documentHtml.replace(scriptTag, `<script>\n${scriptSource}\n<\/script>`);
        });

        if (documentHtml.includes("src=\"./") || documentHtml.includes("href=\"./")) {
          throw new Error("An app asset was not embedded by the loader");
        }
        documentHtml = documentHtml.replace(/<head\b[^>]*>/i, (head) => `${head}\n<base href="${repositoryRoot}">`);

        progress.remove();
        document.open();
        document.write(documentHtml);
        document.close();
      } catch (error) {
        progress.removeAttribute("value");
        status.textContent = `Could not load the latest app: ${error.message}`;
        const retry = document.createElement("a");
        retry.href = "";
        retry.textContent = "Retry";
        retry.addEventListener("click", (event) => {
          event.preventDefault();
          location.reload();
        });
        status.append(document.createElement("br"), retry);
      }
    })();
  </script>
</body>
</html>
